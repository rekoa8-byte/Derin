<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Beautiful modern cursive font import and styles -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&amp;family=Great+Vibes&amp;family=Caveat:wght@600&amp;display=swap');
      .derin-text {
        font-family: 'Montserrat', 'Inter', system-ui, -apple-system, sans-serif;
        font-size: 112px;
        font-weight: 900;
        fill: #FF5E00;
        letter-spacing: -2px;
      }
      .collection-text {
        font-family: 'Great Vibes', 'Caveat', cursive;
        font-size: 82px;
        font-weight: 400;
        fill: #0d0d0d;
        font-style: italic;
      }
      .splash-orange {
        fill: #FF5E00;
      }
    </style>
  </defs>

  <!-- Clean Background -->
  <rect width="600" height="600" fill="#ffffff" rx="120" />

  <g transform="translate(65, 120)">
    <!-- "Derin" bold vibrant orange -->
    <text x="15" y="200" class="derin-text">Derin</text>

    <!-- "collection" black flowing script below "erin" -->
    <text x="145" y="270" class="collection-text">collection</text>

    <!-- Orange Splash Graphics (Top-right of Derin, exactly matching IMG_2238) -->
    <g transform="translate(305, 50)" class="splash-orange">
      <!-- Droplet 1 (Upper left small dot) -->
      <circle cx="20" cy="10" r="7" />

      <!-- Droplet 2 (Left splash petal) -->
      <path d="M 28 85 C 20 60, 5 35, 10 20 C 14 6, 26 12, 33 30 C 40 50, 42 75, 40 90 Z" />

      <!-- Droplet 3 (Center top splash petal) -->
      <path d="M 46 95 C 44 65, 46 30, 53 10 C 58 -4, 69 0, 70 20 C 72 45, 65 75, 58 100 Z" />

      <!-- Droplet 4 (Right upward curved splash petal) -->
      <path d="M 64 105 C 75 75, 105 45, 125 35 C 137 30, 142 42, 130 55 C 110 75, 85 98, 75 110 Z" />

      <!-- Droplet 5 (Right side dot) -->
      <circle cx="116" cy="98" r="5" />

      <!-- Droplet 6 (Lower right sweeping splash petal) -->
      <path d="M 68 116 C 85 105, 115 110, 120 125 C 122 135, 110 142, 95 135 C 80 128, 70 120, 68 116 Z" />
    </g>
  </g>
</svg>
